<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
const R = window.RESUME;
const accent = "#7A1F1F";
const font   = "'Source Serif 4', 'Georgia', serif";

const secTitle = {
  fontFamily: font, fontStyle: "italic", fontWeight: 400,
  fontSize: 15, color: accent, margin: 0, marginBottom: 10,
  textAlign: "center", letterSpacing: "0.04em",
};

function TitleRule() {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "0 auto 12px", maxWidth: 260, justifyContent: "center" }}>
      <div style={{ flex: 1, height: 1, background: "#1a1a1a" }} />
      <div style={{ width: 4, height: 4, background: accent, borderRadius: "50%" }} />
      <div style={{ flex: 1, height: 1, background: "#1a1a1a" }} />
    </div>
  );
}

function Resume() {
  return (
    <div style={{ fontFamily: font, background: "#FBF9F4", color: "#161210", padding: "68px 80px", fontSize: 11, lineHeight: 1.55, width: "100%", boxSizing: "border-box", WebkitFontSmoothing: "antialiased" }}>

      <header style={{ textAlign: "center", marginBottom: 30 }}>
        <div style={{ fontFamily: font, fontStyle: "italic", fontSize: 10.5, letterSpacing: "0.35em", textTransform: "uppercase", color: accent, marginBottom: 8 }}>
          Curriculum Vitae
        </div>
        <h1 style={{ fontFamily: font, fontSize: 40, fontWeight: 600, margin: 0, letterSpacing: "-0.01em", lineHeight: 1.05 }}>{R.name}</h1>
        <div style={{ fontFamily: font, fontStyle: "italic", fontSize: 14, color: "#444", marginTop: 6, marginBottom: 12 }}>{R.title}</div>
        <div style={{ fontSize: 10, color: "#555", display: "flex", justifyContent: "center", gap: 16, flexWrap: "wrap" }}>
          <span>{R.contact.email}</span>
          <span style={{ color: accent }}>•</span>
          <span>{R.contact.linkedin}</span>
        </div>
      </header>

      <section style={{ marginBottom: 26, textAlign: "center", maxWidth: "60ch", marginLeft: "auto", marginRight: "auto" }}>
        <p style={{ margin: 0, fontSize: 11.5, lineHeight: 1.7, fontStyle: "italic", color: "#2a2520" }}>
          &ldquo;{R.summary}&rdquo;
        </p>
      </section>

      <section style={{ marginBottom: 26 }}>
        <h2 style={secTitle}>Experience</h2>
        <TitleRule />
        {R.experience.map((job, i) => (
          <div key={i} style={{ marginBottom: i === R.experience.length - 1 ? 0 : 16 }}>
            <div style={{ textAlign: "center", marginBottom: 5 }}>
              <div style={{ fontFamily: font, fontSize: 15, fontWeight: 600 }}>{job.company}</div>
              <div style={{ fontFamily: font, fontStyle: "italic", fontSize: 11, color: "#555", marginTop: 1 }}>
                {job.role} &nbsp;·&nbsp; {job.domain} &nbsp;·&nbsp; {job.period}
              </div>
            </div>
            <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
              {job.bullets.map((b, j) => (
                <li key={j} style={{ display: "grid", gridTemplateColumns: "1fr 90px", gap: 10, padding: "2.5px 0", fontSize: 10.5, lineHeight: 1.55, alignItems: "baseline" }}>
                  <span style={{ display: "flex", gap: 9 }}>
                    <span style={{ color: accent, flexShrink: 0 }}>§</span>
                    <span>{b.text}</span>
                  </span>
                  <span style={{ fontFamily: font, fontStyle: "italic", fontSize: 9.5, color: accent, textAlign: "right" }}>{b.metric}</span>
                </li>
              ))}
            </ul>
          </div>
        ))}
      </section>

      <section style={{ marginBottom: 26 }}>
        <h2 style={secTitle}>Areas of Expertise</h2>
        <TitleRule />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", columnGap: 32, rowGap: 5 }}>
          {R.skills.map((s, i) => (
            <div key={i} style={{ fontSize: 10.5, lineHeight: 1.6 }}>
              <span style={{ fontStyle: "italic", color: accent }}>{s.label}.</span>{" "}
              <span>{s.items.join(", ")}</span>
            </div>
          ))}
        </div>
      </section>

      <section style={{ marginBottom: 26 }}>
        <h2 style={secTitle}>AI in Quality Engineering</h2>
        <TitleRule />
        <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none", maxWidth: "68ch", marginLeft: "auto", marginRight: "auto" }}>
          {R.ai.map((a, i) => (
            <li key={i} style={{ display: "flex", gap: 9, padding: "2.5px 0", fontSize: 10.5 }}>

        </div>
        <div>
          <h2 style={secTitle}>Education</h2>

            <div style={{ fontSize: 10, color: "#666" }}>{R.education.period} · {R.education.grade}</div>
            <div style={{ fontSize: 9.5, color: "#888", marginTop: 3, fontStyle: "italic" }}>{R.education.extras}</div>
          </div>
        </div>
      </section>
    </div>
  );
}
