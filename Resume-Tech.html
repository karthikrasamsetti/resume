<style>

  .print-btn {

  .page {

    background: #fff;

  @page { size: A4; margin: 0; }
  @media print {

    .page { box-shadow: none !important; width: 210mm !important; min-height: 297mm !important; }

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script>

  name: "Rasamsetti Karthik Raja",
  title: "QA Automation Engineer",
  contact: {
    email: "karthikrasamsetti@gmail.com",
    linkedin: "linkedin.com/in/karthik-rasamsetti-29450319b",

  },

  skills: [
    { label: "Languages",       items: ["Java", "JavaScript", "Python"] },
    { label: "Automation",      items: ["Selenium", "Playwright", "WebDriverIO", "Appium"] },
    { label: "Frameworks",      items: ["TestNG", "Cucumber (BDD)", "Mocha", "Pytest"] },
    { label: "Performance",     items: ["k6", "WebLOAD"] },
    { label: "CI / CD",         items: ["Azure DevOps", "GitHub Actions", "GitLab CI", "CircleCI"] },
    { label: "Database",        items: ["MySQL"] },
    { label: "Version Control", items: ["Git"] },
    { label: "Methodologies",   items: ["Agile", "SDLC", "STLC"] },

<script type="text/babel" data-presets="env,react">
const R = window.RESUME;
const accent   = "#16A34A";
const fontMono = "'JetBrains Mono', ui-monospace, monospace";
const fontSans = "'Inter', system-ui, sans-serif";

function Tag({ text, color }) {
  return (
    <span style={{ fontFamily: fontMono, fontSize: 8.5, color: color || accent, border: "1px solid " + (color || accent), padding: "1px 5px", borderRadius: 2, letterSpacing: "0.02em", whiteSpace: "nowrap" }}>
      {text}
    </span>
  );
}

function SectionTitle({ num, label }) {
  return (
    <h2 style={{ fontFamily: fontMono, fontSize: 10.5, fontWeight: 600, color: "#0a0a0a", margin: 0, marginBottom: 12, display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ color: accent }}>{num}</span>
      <span style={{ letterSpacing: "0.06em" }}>{label}</span>
      <span style={{ flex: 1, height: 1, background: "#e0e0e0" }} />
    </h2>
  );
}

function Resume() {
  return (
    <div style={{ fontFamily: fontSans, background: "#fff", color: "#0a0a0a", padding: "56px 62px", fontSize: 10.5, lineHeight: 1.55, width: "100%", boxSizing: "border-box", WebkitFontSmoothing: "antialiased" }}>

      <header style={{ marginBottom: 30, paddingBottom: 14, borderBottom: "2px solid " + accent }}>
        <div style={{ fontFamily: fontMono, fontSize: 9.5, color: accent, marginBottom: 6, letterSpacing: "0.04em" }}>
          $ whoami <span style={{ opacity: 0.6 }}>_</span>
        </div>
        <h1 style={{ fontFamily: fontMono, fontSize: 28, fontWeight: 700, margin: 0, letterSpacing: "-0.02em", lineHeight: 1.05 }}>{R.name}</h1>
        <div style={{ fontFamily: fontMono, fontSize: 10.5, color: "#444", marginTop: 6, display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ color: accent }}>›</span>
          <span style={{ color: "#0a0a0a", fontWeight: 600 }}>{R.title}</span>
          <span style={{ color: "#bbb" }}>|</span>
          <span>{R.contact.email}</span>
          <span style={{ color: "#bbb" }}>|</span>
          <span>{R.contact.linkedin}</span>
        </div>
      </header>

      <section style={{ marginBottom: 28 }}>
        <SectionTitle num="01" label="SUMMARY" />
        <p style={{ margin: 0, fontSize: 10.5, lineHeight: 1.65, color: "#222" }}>{R.summary}</p>
      </section>

      <section style={{ marginBottom: 28 }}>
        <SectionTitle num="02" label="STACK" />
        <div style={{ display: "grid", gap: 5 }}>
          {R.skills.map((s, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "110px 1fr", gap: 10, alignItems: "center" }}>
              <div style={{ fontFamily: fontMono, fontSize: 9, color: "#777", textTransform: "lowercase", letterSpacing: "0.02em" }}>
                {s.label.toLowerCase().replace(/\s*\/\s*/g, "/").replace(/\s+/g, "_")}
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                {s.items.map((it, j) => (
                  <span key={j} style={{ fontFamily: fontMono, fontSize: 9, background: "#f2f2f3", padding: "2px 6px", borderRadius: 2 }}>{it}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      </section>

      <section style={{ marginBottom: 28 }}>
        <SectionTitle num="03" label="EXPERIENCE" />
        {R.experience.map((job, i) => (
          <div key={i} style={{ marginBottom: i === R.experience.length - 1 ? 0 : 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8, paddingBottom: 5, borderBottom: "1px solid #e8e8e8" }}>
              <div>
                <span style={{ fontFamily: fontMono, fontSize: 14, fontWeight: 700 }}>{job.employer}</span>
                <span style={{ fontFamily: fontMono, fontSize: 9, color: "#777", marginLeft: 10 }}>{job.role}</span>
              </div>
              <div style={{ fontFamily: fontMono, fontSize: 9, color: accent, fontVariantNumeric: "tabular-nums" }}>{job.period}</div>
            </div>
            {job.projects.map((proj, j) => (
              <div key={j} style={{ marginBottom: j === job.projects.length - 1 ? 0 : 14, paddingLeft: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
                  <div>
                    <span style={{ color: accent, fontFamily: fontMono, marginRight: 6 }}>›</span>
                    <span style={{ fontFamily: fontMono, fontSize: 12.5, fontWeight: 700 }}>{proj.client}</span>
                  </div>
                  <div style={{ fontFamily: fontMono, fontSize: 9, color: "#777", fontVariantNumeric: "tabular-nums" }}>{proj.period}</div>
                </div>
                <div style={{ marginBottom: 6 }}><Tag text={proj.domain.toLowerCase()} color="#888" /></div>
                <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
                  {proj.bullets.map((b, k) => (
                    <li key={k} style={{ display: "grid", gridTemplateColumns: "1fr 100px", gap: 10, padding: "2.5px 0", fontSize: 10.5, lineHeight: 1.55, alignItems: "baseline" }}>
                      <span style={{ display: "flex", gap: 9 }}>
                        <span style={{ color: accent, fontFamily: fontMono, flexShrink: 0 }}>›</span>
                        <span>{b.text}</span>
                      </span>
                      <span style={{ textAlign: "right" }}><Tag text={b.metric} /></span>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        ))}
      </section>

      <section style={{ marginBottom: 28 }}>
        <SectionTitle num="04" label="AI_QE" />
        <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
          {R.ai.map((a, i) => (
            <li key={i} style={{ display: "flex", gap: 9, padding: "2.5px 0", fontSize: 10.5 }}>
              <span style={{ color: accent, fontFamily: fontMono, flexShrink: 0 }}>›</span>
              <span>{a}</span>
            </li>
          ))}
        </ul>
      </section>

      <section style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 32 }}>
        <div>
          <SectionTitle num="05" label="WINS" />
          <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
            {R.achievements.map((a, i) => (
              <li key={i} style={{ display: "flex", gap: 9, padding: "2.5px 0", fontSize: 10.5 }}>
                <span style={{ color: accent, fontFamily: fontMono, flexShrink: 0 }}>✓</span>
                <span>{a}</span>
              </li>
            ))}
          </ul>
        </div>
        <div>
          <SectionTitle num="06" label="EDU" />
          <div style={{ fontFamily: fontMono, fontSize: 11.5, fontWeight: 700, marginBottom: 2 }}>{R.education.school}</div>
          <div style={{ fontFamily: fontMono, fontSize: 9, color: "#777", marginBottom: 6 }}>{R.education.location}</div>
          <div style={{ fontSize: 10.5, marginBottom: 2 }}>{R.education.degree}</div>
          <div style={{ fontFamily: fontMono, fontSize: 9, color: "#777", fontVariantNumeric: "tabular-nums", marginTop: 2 }}>{R.education.period} · {R.education.grade}</div>
          <div style={{ fontSize: 9.5, color: "#888", marginTop: 4 }}>{R.education.extras}</div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Resume />);
</script>
</body>
</html>
